# Claude Code on GitHub: answers @claude mentions on issues and pull requests.
# Installed for Agent Hub's "GitHub as a computer" (see github-hub/README.md).
# Needs the Claude GitHub App on this repo (https://github.com/apps/claude) and
# the CLAUDE_CODE_OAUTH_TOKEN repository secret (from `claude setup-token`).
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
jobs:
  claude:
    # Comments from bots (Claude's own progress comment, Codex) never re-trigger a run.
    # Only the repo owner, org members and collaborators can trigger a run. On a
    # public repo, anyone else commenting "@claude" must not be able to spend the
    # OAuth token or drive a workflow that has write access to the repository.
    if: |
      (github.event.comment && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (!github.event.comment && github.event.issue && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
